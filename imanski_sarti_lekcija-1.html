<!doctype html><html lang='bs'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1,viewport-fit=cover'><title>6 imanskih šarta</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:radial-gradient(circle at top,#184c39,#071a14 65%);color:#fff;min-height:100dvh}button{font:inherit}.app{max-width:720px;margin:auto;min-height:100dvh;padding:12px;display:flex;flex-direction:column}.top{text-align:center}.top h1{margin:3px 0;color:#ffd66b;font-size:clamp(25px,6vw,38px)}.sub{opacity:.9;font-size:14px}.progress{height:9px;background:#ffffff24;border-radius:20px;overflow:hidden;margin:10px 0}.bar{height:100%;width:0;background:linear-gradient(90deg,#ffd15c,#fff1a8);transition:.3s}.stats{display:flex;justify-content:space-between;gap:7px;font-weight:700;font-size:13px}.pill{background:#ffffff16;border:1px solid #ffffff24;padding:6px 9px;border-radius:20px}.card{margin-top:10px;background:linear-gradient(145deg,#ffffff18,#ffffff0b);border:1px solid #e8c76a66;border-radius:22px;padding:16px;box-shadow:0 10px 30px #0005;flex:1;display:flex;flex-direction:column;justify-content:center;min-height:390px}.stage{text-align:center;color:#ffd66b;font-weight:800;letter-spacing:.5px}.big{text-align:center;font-size:clamp(24px,7vw,42px);font-weight:900;margin:12px 0}.meaning{text-align:center;font-size:clamp(17px,4.6vw,24px);line-height:1.35}.opts{display:grid;gap:9px;margin-top:15px}.opt,.mainbtn{border:1px solid #f4d57566;background:#112e25;color:#fff;border-radius:15px;padding:13px;font-weight:750;cursor:pointer}.opt:active,.mainbtn:active{transform:scale(.985)}.mainbtn{background:linear-gradient(#d5a936,#9a6b12);color:#111;border:0}.good{background:#176b45!important}.bad{background:#7c2830!important}.row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}.chip{padding:10px;border:1px solid #f0cf7077;border-radius:13px;background:#102c23;cursor:pointer;text-align:center}.selected{outline:3px solid #ffd45e}.order{display:grid;gap:7px}.order .chip{display:flex;gap:8px;align-items:center;text-align:left}.num{width:27px;height:27px;border-radius:50%;display:grid;place-items:center;background:#d6aa39;color:#111;font-weight:900;flex:none}.footer{text-align:center;padding:9px 0 2px;font-size:12px;color:#e8dcae}.stars{font-size:42px;text-align:center}.small{font-size:13px;opacity:.85;text-align:center}.hidden{display:none}.learnnav{display:flex;gap:8px;margin-top:14px}.learnnav button{flex:1}.result{font-size:20px;text-align:center;line-height:1.5}.mistakes{font-size:14px;background:#0003;padding:10px;border-radius:12px;margin-top:10px}.matchgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.matchgrid .chip{min-height:65px;display:grid;place-items:center}.locked{opacity:.25;pointer-events:none}.celebrate{animation:pop .5s ease}@keyframes pop{50%{transform:scale(1.05)}}
@media(max-height:700px){.app{padding:7px}.card{min-height:300px;padding:11px}.top h1{font-size:24px;margin:0}.big{margin:7px 0}.opt,.mainbtn{padding:9px}.footer{padding:4px}}
</style></head><body><main class='app'><header class='top'><h1>✨ 6 IMANSKIH ŠARTA ✨</h1><div class='sub'>Nauči • Vježbaj • Provjeri znanje</div><div class='progress'><div class='bar' id='bar'></div></div><div class='stats'><span class='pill' id='level'>1/7 Nauči</span><span class='pill' id='score'>Bodovi: 0</span><span class='pill' id='stars'>⭐ 0</span></div></header><section class='card' id='card'></section><footer class='footer'>Pripremio Abdo ef. Rekić</footer></main>
<script>
const S=[
['AMENTU BILLAHI','Vjerujem u Allaha, dž.š.'],['VE MELAIKETIHI','Vjerujem u Allahove meleke'],['VE KUTUBIHI','Vjerujem u Allahove knjige'],['VE RUSULIHI','Vjerujem u Allahove poslanike'],['VEL-JEVMIL-AHIRI','Vjerujem u Sudnji dan'],['VE BIL-KADERI HAJRIHI VE ŠERRIHI MINALLAHI TE’ALA','Vjerujem da sve što se događa biva Allahovom odredbom']];
let stage=0,score=0,star=0,learn=0,miss=[],q=0,total=0,selected=null,matched=0;
const C=document.getElementById('card'), bar=document.getElementById('bar');
const names=['Nauči','Spoji','Složi redom','Šta nedostaje?','Prepoznaj značenje','Brzi izazov','Završni ispit'];
function shuffle(a){return [...a].sort(()=>Math.random()-.5)} function upd(){document.getElementById('score').textContent='Bodovi: '+score;document.getElementById('stars').textContent='⭐ '+star;document.getElementById('level').textContent=(stage+1)+'/7 '+names[stage];bar.style.width=((stage)/7*100)+'%'}
function beep(ok){try{let x=new AudioContext(),o=x.createOscillator(),g=x.createGain();o.frequency.value=ok?700:190;g.gain.value=.06;o.connect(g);g.connect(x.destination);o.start();o.stop(x.currentTime+.13)}catch(e){}}
function award(ok,item){if(ok){score+=10;beep(1)}else{score-=3;beep(0); if(item)miss.push(item)}upd()}
function nextStage(){star=Math.min(3,star+(stage==0||stage==3||stage==6?1:0));stage++;q=0;total=0;selected=null;matched=0;upd(); if(stage>=7)return finish(); render()}
function render(){upd(); if(stage==0)learnStage();else if(stage==1)matchStage();else if(stage==2)orderStage();else if(stage==3)missingStage();else if(stage==4)meaningStage();else if(stage==5)rapidStage();else examStage()}
function learnStage(){let s=S[learn];C.innerHTML=`<div class=stage>1. NAUČI</div><div class=small>Imanski šart ${learn+1} od 6</div><div class=big>${s[0]}</div><div class=meaning>${s[1]}</div><div class=learnnav><button class=opt onclick='learn=Math.max(0,learn-1);render()'>← Prethodni</button><button class=mainbtn onclick='if(learn<5){learn++;render()}else nextStage()'>${learn<5?'Sljedeći →':'Počni vježbu ✓'}</button></div>`}
function matchStage(){let left=shuffle(S.map((s,i)=>[s[0],i])),right=shuffle(S.map((s,i)=>[s[1],i]));C.innerHTML=`<div class=stage>2. SPOJI PAROVE</div><div class=small>Dodirni naziv, pa njegovo značenje.</div><div class=matchgrid id=mg>${left.map(x=>`<button class=chip data-side=l data-id=${x[1]}>${x[0]}</button>`).join('')}${right.map(x=>`<button class=chip data-side=r data-id=${x[1]}>${x[0]}</button>`).join('')}</div>`;let first=null;C.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{if(!first){first=b;b.classList.add('selected');return}if(first.dataset.side==b.dataset.side){first.classList.remove('selected');first=b;b.classList.add('selected');return}let ok=first.dataset.id==b.dataset.id;award(ok,S[+first.dataset.id][0]);if(ok){first.classList.add('locked','good');b.classList.add('locked','good');matched++;if(matched==6)setTimeout(nextStage,500)}else{b.classList.add('bad');setTimeout(()=>b.classList.remove('bad'),350);first.classList.remove('selected')}first=null})}
function orderStage(){let arr=shuffle(S.map((s,i)=>({t:s[0],id:i}))),placed=[];function draw(){C.innerHTML=`<div class=stage>3. SLOŽI REDOM</div><div class=small>Dodiruj imanske šarte pravilnim redom.</div><div class=order>${placed.map((x,i)=>`<div class='chip good'><span class=num>${i+1}</span>${x.t}</div>`).join('')}${arr.map(x=>`<button class=chip data-id=${x.id}>${x.t}</button>`).join('')}</div>`;C.querySelectorAll('button.chip').forEach(b=>b.onclick=()=>{let id=+b.dataset.id;if(id==placed.length){award(1);placed.push(arr.find(x=>x.id==id));arr=arr.filter(x=>x.id!=id);if(placed.length==6)setTimeout(nextStage,450);else draw()}else{award(0,S[id][0]);b.classList.add('bad');setTimeout(()=>b.classList.remove('bad'),300)}})}draw()}
function missingStage(){let idx=1+Math.floor(Math.random()*4);let opts=shuffle([S[idx],...shuffle(S.filter((_,i)=>i!=idx)).slice(0,3)]);C.innerHTML=`<div class=stage>4. ŠTA NEDOSTAJE?</div><div class=meaning>${S[idx-1][0]} → <b style='color:#ffd66b'>❓</b> → ${S[idx+1][0]}</div><div class=opts>${opts.map(x=>`<button class=opt data-a='${x[0].replaceAll("'","&#39;")}'>${x[0]}</button>`).join('')}</div><div class=small>Tačan odgovor otkriva kariku u lancu.</div>`;C.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{let ok=b.textContent==S[idx][0];award(ok,S[idx][0]);b.classList.add(ok?'good':'bad');if(ok)setTimeout(nextStage,500)})}
function meaningStage(){askMeaning(0)} function askMeaning(n){if(n>=6)return nextStage();let idx=n,opts=shuffle([S[idx],...shuffle(S.filter((_,i)=>i!=idx)).slice(0,3)]);C.innerHTML=`<div class=stage>5. PREPOZNAJ PO ZNAČENJU</div><div class=small>${n+1}/6</div><div class=meaning>${S[idx][1]}</div><div class=opts>${opts.map(x=>`<button class=opt>${x[0]}</button>`).join('')}</div>`;C.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{let ok=b.textContent==S[idx][0];award(ok,S[idx][0]);b.classList.add(ok?'good':'bad');if(ok)setTimeout(()=>askMeaning(n+1),350)})}
function makeQ(){let i=Math.floor(Math.random()*6),type=Math.floor(Math.random()*4),prompt,ans,choices;if(type==0){prompt=`Koji je ${i+1}. imanski šart?`;ans=S[i][0];choices=shuffle([S[i],...shuffle(S.filter((_,j)=>j!=i)).slice(0,3)]).map(x=>x[0])}else if(type==1){prompt=`Šta znači: ${S[i][0]}?`;ans=S[i][1];choices=shuffle([S[i],...shuffle(S.filter((_,j)=>j!=i)).slice(0,3)]).map(x=>x[1])}else if(type==2&&i<5){prompt=`Šta dolazi poslije: ${S[i][0]}?`;ans=S[i+1][0];choices=shuffle([S[i+1],...shuffle(S.filter((_,j)=>j!=i+1)).slice(0,3)]).map(x=>x[0])}else{if(i==0)i=1;prompt=`Šta dolazi prije: ${S[i][0]}?`;ans=S[i-1][0];choices=shuffle([S[i-1],...shuffle(S.filter((_,j)=>j!=i-1)).slice(0,3)]).map(x=>x[0])}return{prompt,ans,choices,item:S[i][0]}}
function quizRound(limit,done,label){if(q>=limit){q=0;return done()}let z=makeQ();C.innerHTML=`<div class=stage>${label}</div><div class=small>Pitanje ${q+1}/${limit}</div><div class=meaning>${z.prompt}</div><div class=opts>${z.choices.map(x=>`<button class=opt>${x}</button>`).join('')}</div>`;C.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{let ok=b.textContent==z.ans;award(ok,z.item);b.classList.add(ok?'good':'bad');if(ok){q++;setTimeout(()=>quizRound(limit,done,label),300)}})}
function rapidStage(){quizRound(10,nextStage,'6. BRZI IZAZOV')}
function examStage(){quizRound(18,nextStage,'7. ZAVRŠNI ISPIT')}
function finish(){bar.style.width='100%';let unique=[...new Set(miss)];let pct=Math.max(0,Math.min(100,Math.round((score/(10*(6+6+1+6+10+18)))*100)));C.innerHTML=`<div class=stage>LEKCIJA ZAVRŠENA</div><div class=stars>⭐⭐⭐</div><div class=big>Bravo!</div><div class=result>Prošao/la si svih 7 etapa.<br><b>Bodovi: ${score}</b></div>${unique.length?`<div class=mistakes><b>Treba još ponoviti:</b><br>${unique.join('<br>')}</div><button class=mainbtn style='margin-top:12px' onclick='review()'>🔁 Ponovi moje greške</button>`:`<div class=meaning>Bez evidentiranih grešaka! 🏆</div>`}<button class=opt style='margin-top:8px' onclick='location.reload()'>↻ Igraj ponovo</button>`}
function review(){let u=[...new Set(miss)];if(!u.length)return;let pool=u.map(t=>S.find(x=>x[0]==t)).filter(Boolean);q=0;function one(){if(q>=pool.length){C.innerHTML=`<div class=big>Odlično! ✓</div><div class=meaning>Greške su ponovljene.</div><button class=mainbtn onclick='location.reload()'>Nova igra</button>`;return}let s=pool[q],opts=shuffle([s,...shuffle(S.filter(x=>x!=s)).slice(0,3)]);C.innerHTML=`<div class=stage>PONOVI MOJE GREŠKE</div><div class=meaning>${s[1]}</div><div class=opts>${opts.map(x=>`<button class=opt>${x[0]}</button>`).join('')}</div>`;C.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{if(b.textContent==s[0]){b.classList.add('good');q++;setTimeout(one,350)}else{b.classList.add('bad');beep(0)}})}one()}
render();
</script></body></html>
